<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jennifer's Space Invaders cover</title>
  <desc id="desc">A refined, personal Space Invaders cover with a premium arcade style and portfolio colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f1b48"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" x2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="14" y="14" width="772" height="472" rx="22" fill="none" stroke="rgba(255,255,255,0.12)"/>

  <g fill="#f8fafc" opacity="0.75">
