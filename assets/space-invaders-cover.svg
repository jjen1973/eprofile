      <rect x="40" y="0" width="40" height="22" rx="6"/>
      <rect x="80" y="0" width="40" height="22" rx="6"/>
      <rect x="20" y="30" width="40" height="22" rx="6"/>
      <rect x="60" y="30" width="40" height="22" rx="6"/>
