      <rect x="48" y="0" width="42" height="22" rx="6"/>
      <rect x="96" y="0" width="42" height="22" rx="6"/>
      <rect x="144" y="0" width="42" height="22" rx="6"/>
      <rect x="24" y="30" width="42" height="22" rx="6"/>
      <rect x="72" y="30" width="42" height="22" rx="6"/>
      <rect x="120" y="30" width="42" height="22" rx="6"/>
      <rect x="48" y="60" width="42" height="22" rx="6"/>
      <rect x="96" y="60" width="42" height="22" rx="6"/>
