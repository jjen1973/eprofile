    <circle cx="160" cy="150" r="2"/>
    <circle cx="260" cy="100" r="2.5"/>
    <circle cx="650" cy="120" r="2.5"/>
    <circle cx="715" cy="185" r="2"/>
    <circle cx="520" cy="85" r="2.5"/>
    <circle cx="760" cy="160" r="2"/>
    <circle cx="700" cy="260" r="2.5"/>
    <circle cx="190" cy="310" r="2"/>
